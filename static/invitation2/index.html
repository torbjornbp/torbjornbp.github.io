<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>The Wizard's Feast</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
    --gold: #d8b95c;
    --gold-dim: #9a8248;
    --ink: #3a2a18;
    --parchment: #e8d7ae;
    --leather: #241710;
    --page: #e9dcbb;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0; padding: 0; height: 100%;
    background: #020203;
    font-family: 'IM Fell English', 'Times New Roman', serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
}
canvas { display: block; touch-action: none; }

/* ═══════════════ loading / enter ═══════════════ */
#veil {
    position: fixed; inset: 0; z-index: 90;
    background:
        radial-gradient(ellipse at 50% 38%, rgba(30, 26, 16, 0.88) 0%, rgba(2, 2, 3, 0.97) 78%),
        #020203;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 1.1s ease, visibility 1.1s;
}
#veil.gone { opacity: 0; visibility: hidden; }
#veil h1 {
    font-family: 'Jacquard 12', serif; font-weight: 400;
    font-size: clamp(2.6rem, 8vw, 5.2rem);
    color: var(--gold); margin: 0 0 .1em;
    letter-spacing: .06em; text-align: center; line-height: 1;
    text-shadow: 0 0 34px rgba(216, 185, 92, .35);
}
#veil .sub {
    color: #b3a071; font-style: italic;
    font-size: clamp(1rem, 2.6vw, 1.25rem); margin-bottom: 2.6em;
}
#barWrap {
    width: min(340px, 72vw); height: 2px;
    background: rgba(216, 185, 92, .16);
    margin-bottom: 1.1em;
}
#bar { width: 0%; height: 100%; background: var(--gold); transition: width .3s ease; }
#barLabel { color: #7d6f4e; font-size: .85rem; letter-spacing: .08em; }
#enterBtn {
    display: none; margin-top: 1.4em;
    font-family: 'IM Fell English', serif; font-size: 1.15rem;
    letter-spacing: .12em; color: var(--gold);
    background: rgba(20, 16, 8, .5);
    border: 1px solid rgba(216, 185, 92, .55);
    padding: .7em 2.4em; cursor: pointer;
    transition: background .25s, box-shadow .25s;
}
#enterBtn:hover { background: rgba(60, 48, 22, .5); box-shadow: 0 0 26px rgba(216, 185, 92, .22); }

/* ═══════════════ hotspot markers ═══════════════ */
.mark {
    position: fixed; z-index: 20;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none; cursor: pointer;
    opacity: 0; transition: opacity .5s;
}
.mark.on { opacity: 1; }
.mark .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: rgba(232, 215, 174, .9);
    box-shadow: 0 0 10px rgba(232, 215, 174, .8), 0 0 26px rgba(216, 185, 92, .5);
    animation: pulse 2.6s ease-in-out infinite;
}
.mark.gold .dot {
    background: rgba(126, 224, 158, .95);
    box-shadow: 0 0 10px rgba(126, 224, 158, .9), 0 0 30px rgba(70, 200, 120, .45);
}
.mark .lbl {
    margin-top: 7px; white-space: nowrap;
    color: #e6d8ae; font-size: .82rem; letter-spacing: .1em;
    background: rgba(8, 7, 4, .68);
    border: 1px solid rgba(216, 185, 92, .28);
    padding: .18em .7em;
    opacity: 0; transform: translateY(3px);
    transition: opacity .25s, transform .25s;
}
.mark:hover .lbl, .mark.hot .lbl { opacity: 1; transform: translateY(0); }
.mark.hidden { opacity: 0 !important; pointer-events: none; }
@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: .95; }
    50% { transform: scale(1.35); opacity: .6; }
}

/* ═══════════════ buttons / toast / hint ═══════════════ */
#backBtn {
    position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 40;
    font-family: 'IM Fell English', serif; font-size: .98rem; letter-spacing: .08em;
    color: var(--gold); background: rgba(8, 7, 4, .62);
    border: 1px solid rgba(216, 185, 92, .45);
    padding: .5em 1.15em; cursor: pointer;
    opacity: 0; visibility: hidden;
    transition: opacity .4s, visibility .4s, background .2s;
}
#backBtn.show { opacity: 1; visibility: visible; }
#backBtn:hover { background: rgba(50, 40, 18, .7); }

#muteBtn {
    position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); right: 16px; z-index: 40;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(8, 7, 4, .6); border: 1px solid rgba(216, 185, 92, .5);
    color: var(--gold); font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, opacity .4s; opacity: 0;
}
#muteBtn.show { opacity: 1; }
#muteBtn:hover { background: rgba(50, 40, 18, .7); }

#toast {
    position: fixed; left: 50%; bottom: max(11vh, calc(env(safe-area-inset-bottom) + 60px)); z-index: 40;
    transform: translateX(-50%);
    color: #e6d8ae; font-style: italic; font-size: 1.02rem; text-align: center;
    background: rgba(8, 7, 4, .72);
    border: 1px solid rgba(230, 216, 174, .3);
    padding: .6em 1.5em; max-width: min(560px, 88vw);
    opacity: 0; pointer-events: none; transition: opacity .45s;
}
#toast.show { opacity: 1; }

#hint {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 30;
    transform: translateX(-50%);
    color: #8d7f5c; font-size: .84rem; letter-spacing: .07em;
    white-space: nowrap; opacity: 0; transition: opacity .8s;
    pointer-events: none;
}
#hint.show { opacity: .9; }

/* ═══════════════ in-scene book navigation ═══════════════ */
#bookNav {
    position: fixed; left: 50%; bottom: max(20px, calc(env(safe-area-inset-bottom) + 14px));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px;
    z-index: 40;
    opacity: 0; visibility: hidden; transition: opacity .4s, visibility .4s;
}
#bookNav.show { opacity: 1; visibility: visible; }
#bookNav button {
    width: 48px; height: 48px; border-radius: 50%;
    font-family: 'IM Fell English', serif; font-size: 1.5rem; line-height: 1;
    color: var(--gold); background: rgba(8, 7, 4, .66);
    border: 1px solid rgba(216, 185, 92, .5);
    cursor: pointer; transition: background .2s, opacity .2s;
    display: flex; align-items: center; justify-content: center;
}
#bookNav button:hover:not(:disabled) { background: rgba(60, 48, 22, .75); }
#bookNav button:disabled { opacity: .25; cursor: default; }
#bookCount { color: #9a8248; font-size: .9rem; letter-spacing: .14em; }

/* ═══════════════ misc ═══════════════ */
#err {
    position: fixed; inset: auto 0 0 0; z-index: 99; padding: 1em;
    background: #200; color: #e77; font-size: .85rem; text-align: center; display: none;
}
@media (max-width: 640px) {
    .mark .lbl { font-size: .72rem; }
    .mark .dot { width: 11px; height: 11px; }
}
@media (prefers-reduced-motion: reduce) {
    .mark .dot { animation: none; }
}
</style>

<div id="veil">
    <h1 id="veilTitle">The Wizard's Feast</h1>

    <div id="barLabel">summoning the hall&hellip;</div>
    <button id="enterBtn">Enter the Hall</button>
</div>

<div id="markers"></div>

<button id="backBtn">← Back to the hall</button>

<div id="bookNav">

</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ═══════════════════════════════════════════════════════════════════════
   COPY — every user-facing string lives here. Translate freely.
   ═══════════════════════════════════════════════════════════════════════ */
const COPY = {
    veilTitle: "The Wizard's Feast",
    veilSub: "a dinner invitation, delivered in person",
    loading: "summoning the hall…",
    loadingFonts: "letting the ink dry…",
    enter: "Enter the Hall",
    hint: "drag to look · scroll or pinch to zoom · click the lights",
    back: "← Back to the hall",
    enterToast: "Something is brewing. The invitation waits by the cauldron.",
    scroll: {
        title: "An Invitation",
        lines: [
            "You are cordially summoned",
            "to a feast in the Old Hall,",
            "when the next full moon stands highest.",
            "",
            "Come in darkness. Bring a friend,",
            "a hungry stomach and a thirsty throat.",
            "",
            "Be at the gate when the bells fall silent.",
        ],
        signature: "— The Secret Order of the Cauldron",
    },
    tome: {
        title: "The Brewmaster's Tome",
        intro: [
            "Found where the steam rises thickest.",
            "Turn the pages gently — they remember.",
        ],
        signature: "— the Brewmaster",
        ingredients: "Ingredients",
        method: "Method",
        serves: "serves",
        empty: "The page is blank — the brewmaster has yet to write here.",
        toast: "The tome creaks open. Recipes older than the walls.",
    },
    spots: {
        scroll:  { label: "The Invitation", gold: true },
        tome:    { label: "The Tome",       gold: true },
        cauldron:{ label: "The Brew" },
        skull:   { label: "An Old Friend" },
    },
    flavor: {
        cauldron: "The brew stirs. Something beneath the surface winks at you.",
        skull: "The skull sighs: 'Not another dinner party…'",
    },
    noWebGL: "Your browser could not summon the hall (WebGL unavailable).",
};

/* ═══════════════════════════════════════════════════════════════════════
   RECIPES — TODO: replace these placeholders with your real recipes.
   Each recipe fills one two-page spread in the tome:
     title       dish name (string)
     serves      e.g. "four hungry souls" (optional string)
     ingredients array of strings  → left page
     steps       array of strings  → right page
     note        small italic line under the method (optional)
   Add or remove entries as you like; the page counter adapts.
   ═══════════════════════════════════════════════════════════════════════ */
const RECIPES = [
    {
        title: "Placeholder Recipe the First",
        serves: "TODO",
        ingredients: [
            "TODO — first ingredient",
            "TODO — second ingredient",
            "TODO — a pinch of something",
        ],
        steps: [
            "TODO — first step of the method.",
            "TODO — second step of the method.",
        ],
        note: "TODO — a serving suggestion, or a warning.",
    },
    {
        title: "Placeholder Recipe the Second",
        serves: "TODO",
        ingredients: [
            "TODO — first ingredient",
            "TODO — second ingredient",
        ],
        steps: [
            "TODO — first step of the method.",
            "TODO — second step of the method.",
        ],
        note: "TODO — a note in the margin.",
    },
];

/* ═══════════════════════════════════════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════════════════════════════════════ */
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const IS_MOBILE = IS_TOUCH && Math.min(innerWidth, innerHeight) < 820;
const HALL = { x: 12, z: 10, h: 9 };          // half-extents + ceiling height
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = id => document.getElementById(id);
const veil = $('veil'), bar = $('bar'), barLabel = $('barLabel'), enterBtn = $('enterBtn');
const backBtn = $('backBtn'), muteBtn = $('muteBtn'), toastEl = $('toast'), hintEl = $('hint');
const markersRoot = $('markers');

/* populate static copy */
$('veilTitle').textContent = COPY.veilTitle;
$('veilSub').textContent = COPY.veilSub;
enterBtn.textContent = COPY.enter;
backBtn.textContent = COPY.back;
hintEl.textContent = COPY.hint;

/* ═══════════════════════════════════════════════════════════════════════
   RENDERER / SCENE / CAMERA / POST
   ═══════════════════════════════════════════════════════════════════════ */
let renderer;
try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
    barLabel.textContent = COPY.noWebGL;
    throw e;
}
let DPR = Math.min(devicePixelRatio || 1, IS_MOBILE ? 1.5 : 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030405);
scene.fog = new THREE.FogExp2(0x070a0d, 0.05);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 60);
camera.position.set(0.05, 3.55, 0.95);
camera.lookAt(-0.05, 1.02, -1.9);

/* post-processing: bloom + grade (vignette, grain, aberration) */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
    new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.65, 0.75);
composer.addPass(bloom);

const GradeShader = {
    uniforms: {
        tDiffuse: { value: null },
        uTime: { value: 0 },
        uVig: { value: 1.05 },
        uGrain: { value: 0.05 },
        uCA: { value: 0.0016 },
    },
    vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse;
        uniform float uTime, uVig, uGrain, uCA;
        varying vec2 vUv;
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        void main() {
            vec2 d = vUv - 0.5;
            float r2 = dot(d, d);
            vec2 off = d * uCA * (0.5 + r2 * 4.0);
            vec3 col;
            col.r = texture2D(tDiffuse, vUv + off).r;
            col.g = texture2D(tDiffuse, vUv).g;
            col.b = texture2D(tDiffuse, vUv - off).b;
            /* lift shadows toward teal, warm the highs a touch */
            float lum = dot(col, vec3(0.299, 0.587, 0.114));
            col = mix(col, col * vec3(0.82, 0.94, 1.04), (1.0 - smoothstep(0.0, 0.45, lum)) * 0.55);
            col += vec3(0.035, 0.02, 0.0) * smoothstep(0.55, 1.0, lum);
            /* gentle saturation push (stylized look) */
            float sat = dot(col, vec3(0.299, 0.587, 0.114));
            col = mix(vec3(sat), col, 1.14);
            /* vignette */
            col *= 1.0 - uVig * r2 * 0.9;
            /* grain */
            float g = hash(vUv * vec2(1920.0, 1080.0) + fract(uTime) * 7.0) - 0.5;
            col += g * uGrain;
            gl_FragColor = vec4(col, 1.0);
        }`,
};
const gradePass = new ShaderPass(GradeShader);
composer.addPass(gradePass);
composer.addPass(new OutputPass());

/* ═══════════════════════════════════════════════════════════════════════
   TEXTURES  (ambientCG CC0 sets, downscaled to 512)
   ═══════════════════════════════════════════════════════════════════════ */
const maxAniso = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
const texLoader = new THREE.TextureLoader();

function pbr(name, opts = {}) {
    const t = texLoader.load(`assets/textures/${name}.jpg`);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = maxAniso;
    if (opts.srgb) t.colorSpace = THREE.SRGBColorSpace;
    return t;
}
const T = {
    wallCol: pbr('wall_col', { srgb: true }),  wallNrm: pbr('wall_nrm'),
    wallRgh: pbr('wall_rgh'),                 wallAO: pbr('wall_ao'),
    floorCol: pbr('floor_col', { srgb: true }), floorNrm: pbr('floor_nrm'),
    floorRgh: pbr('floor_rgh'),               floorAO: pbr('floor_ao'),
    ceilCol: pbr('ceil_col', { srgb: true }), ceilNrm: pbr('ceil_nrm'),
    ceilRgh: pbr('ceil_rgh'),                 ceilAO: pbr('ceil_ao'),
};

function pbrMaterial(base, repeatU, repeatV, tint = 0xffffff) {
    const m = new THREE.MeshStandardMaterial({
        map: base.col, normalMap: base.nrm,
        roughnessMap: base.rgh, aoMap: base.ao,
        roughness: 1, metalness: 0.02,
        color: tint, envMapIntensity: 0.5,
    });
    for (const k of ['map', 'normalMap', 'roughnessMap', 'aoMap']) {
        if (m[k]) { m[k].repeat.set(repeatU, repeatV); m[k].needsUpdate = true; }
    }
    return m;
}

const wallMat  = pbrMaterial({ col: T.wallCol,  nrm: T.wallNrm,  rgh: T.wallRgh,  ao: T.wallAO  }, 1, 1, 0x9b98a2);
const floorMat = pbrMaterial({ col: T.floorCol, nrm: T.floorNrm, rgh: T.floorRgh, ao: T.floorAO }, 1, 1, 0x8e8a94);
const ceilMat  = pbrMaterial({ col: T.ceilCol,  nrm: T.ceilNrm,  rgh: T.ceilRgh,  ao: T.ceilAO  }, 1, 1, 0x6a6058);

const woodMat  = new THREE.MeshStandardMaterial({ color: 0x2b1d12, roughness: 0.88, metalness: 0.03 });
const darkWood = new THREE.MeshStandardMaterial({ color: 0x1c130b, roughness: 0.9 });
const stoneMat = new THREE.MeshStandardMaterial({ color: 0x33363e, roughness: 0.95 });
const ironMat  = new THREE.MeshStandardMaterial({ color: 0x1f2126, roughness: 0.42, metalness: 0.85 });
const goldMat  = new THREE.MeshStandardMaterial({ color: 0x8a6a2a, roughness: 0.5, metalness: 0.7 });

/* ═══════════════════════════════════════════════════════════════════════
   THE STUDY  —  a cozy wizard's chamber in the dungeon
   Origin: workbench center-back. +Z toward camera/door, -Z back wall.
   ═══════════════════════════════════════════════════════════════════════ */
const ROOM = { x: 4.2, z: 3.6, h: 4.6 };      // half-depth front/back from origin
const BENCH = { w: 3.3, d: 1.05, top: 0.98, z: -1.9 };  // workbench
const TOP_Y = BENCH.top;                      // bench surface height

function slab(x0, x1, y0, y1, z0, z1, mat, rx, ry, tint) {
    const w = x1 - x0, h = y1 - y0, d = z1 - z0;
    let m = mat;
    if (tint !== undefined || rx !== undefined) {
        m = mat.clone();
        m.color = new THREE.Color(tint ?? mat.color.getHex());
        if (m.map) {
            m.map = m.map.clone();
            m.map.needsUpdate = true;
            m.normalMap = m.normalMap ? m.normalMap.clone() : null;
            m.roughnessMap = m.roughnessMap ? m.roughnessMap.clone() : null;
            m.aoMap = m.aoMap ? m.aoMap.clone() : null;
            for (const k of ['normalMap', 'roughnessMap', 'aoMap']) if (m[k]) m[k].needsUpdate = true;
        }
        if (rx !== undefined && m.map) {
            m.map.repeat.set(rx, ry);
            if (m.normalMap) m.normalMap.repeat.set(rx, ry);
            if (m.roughnessMap) m.roughnessMap.repeat.set(rx, ry);
            if (m.aoMap) m.aoMap.repeat.set(rx, ry);
        }
    }
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    scene.add(mesh);
    return mesh;
}

/* floor + ceiling */
slab(-ROOM.x, ROOM.x, -0.5, 0, -ROOM.z, ROOM.z, floorMat, 7, 6, 0x96939e);
slab(-ROOM.x, ROOM.x, ROOM.h, ROOM.h + 0.5, -ROOM.z, ROOM.z, ceilMat, 7, 6, 0x5a5148);

/* back wall (behind bench, with the shelves) gets its own repeat */
slab(-ROOM.x - .6, ROOM.x + .6, 0, ROOM.h, -ROOM.z - .6, -ROOM.z, wallMat, 2.8, 1.5, 0xa09daa);
/* side walls */
slab(-ROOM.x - .6, -ROOM.x, 0, ROOM.h, -ROOM.z, ROOM.z, wallMat, 2.4, 1.5, 0x9a97a4);
slab(ROOM.x, ROOM.x + .6, 0, ROOM.h, -ROOM.z, ROOM.z, wallMat, 2.4, 1.5, 0x9a97a4);
/* front wall (behind camera): door gap in middle */
slab(-ROOM.x - .6, -1.0, 0, ROOM.h, ROOM.z, ROOM.z + .6, wallMat, 1.9, 1.5, 0x9693a0);
slab(1.0, ROOM.x + .6, 0, ROOM.h, ROOM.z, ROOM.z + .6, wallMat, 1.9, 1.5, 0x9693a0);
slab(-1.0, 1.0, 2.6, ROOM.h, ROOM.z, ROOM.z + .6, wallMat, 0.7, 0.7, 0x8f8c99);

/* skirting */
slab(-ROOM.x, ROOM.x, 0, 0.4, -ROOM.z + .02, -ROOM.z + .3, stoneMat, 1, 1, 0x2e3138);
slab(-ROOM.x + .0, -ROOM.x + .3, 0, 0.4, -ROOM.z, ROOM.z, stoneMat, 1, 1, 0x2e3138);
slab(ROOM.x - .3, ROOM.x, 0, 0.4, -ROOM.z, ROOM.z, stoneMat, 1, 1, 0x2e3138);

/* ceiling beams */
for (let i = -1; i <= 1; i++) {
    slab(-ROOM.x, ROOM.x, ROOM.h - 0.4, ROOM.h - 0.08, i * 2.2 - 0.18, i * 2.2 + 0.18, woodMat, 1, 1, 0x241a10);
}

/* ═══════════════════════════════════════════════════════════════════════
   MODEL LOADING  (CC0: Kenney kits + Poly Pizza cauldron/scroll)
   ═══════════════════════════════════════════════════════════════════════ */
const manager = new THREE.LoadingManager();
manager.onProgress = (u, loaded, total) => {
    bar.style.width = `${Math.round(loaded / total * 100)}%`;
};
const gltfLoader = new GLTFLoader(manager);

const box3 = o => new THREE.Box3().setFromObject(o);
const sizeOf = o => box3(o).getSize(new THREE.Vector3());

function scaleToHeight(m, h) {
    const s = sizeOf(m);
    m.scale.setScalar(h / Math.max(s.y, 1e-5));
}
function ground(m, y = 0) {
    m.position.y += y - box3(m).min.y;
}
function tintModel(m, hex) {
    const c = new THREE.Color(hex);
    m.traverse(o => {
        if (o.isMesh && o.material) {
            o.material = o.material.clone();
            o.material.color = o.material.color.clone().multiply(c);
        }
    });
}

/* Load a GLB, normalize it, park it; call done(model) — or done(null) on
   failure so the caller can fall back. Never blocks the loading bar.
   - height:   normalize model to this height (m)
   - stretch:  stretch longest horizontal axis to this length (m)
   - alongZ:   lay the stretched long axis along Z instead of X
   - baseY:    sit the model on this height (default: floor)
   - tilt/rotY: extra rotations                     */
function prop(url, { pos, rotY = 0, tilt = 0, height, baseY = 0, tint, stretch, alongZ } = {}, done) {
    gltfLoader.load(url, g => {
        const m = g.scene;
        if (height) scaleToHeight(m, height);
        if (stretch) {
            if (sizeOf(m).z > sizeOf(m).x) m.rotation.y = Math.PI / 2;
            const len = Math.max(sizeOf(m).x, 1e-4);
            m.scale.x *= stretch / len; m.scale.z *= stretch / len;
            if (alongZ) m.rotation.y += Math.PI / 2;
        } else if (alongZ && sizeOf(m).x > sizeOf(m).z) {
            m.rotation.y += Math.PI / 2;
        }
        if (tilt) m.rotation.z += tilt;
        if (rotY) m.rotation.y += rotY;
        m.position.set(pos[0], 0, pos[2]);
        ground(m, baseY);
        /* recentre horizontally so `pos` marks the visual centre */
        const b = box3(m);
        m.position.x += pos[0] - (b.min.x + b.max.x) / 2;
        m.position.z += pos[2] - (b.min.z + b.max.z) / 2;
        if (tint) tintModel(m, tint);
        scene.add(m);
        done && done(m);
    }, undefined, () => done && done(null));
}

/* simple box fallback for when a GLB cannot be fetched */
function fallbackBox(w, h, d, mat, x, z, baseY = 0) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, baseY + h / 2, z);
    scene.add(m);
    return m;
}

function radialTex(stops, size = 128) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(size / 2, size / 2, 1, size / 2, size / 2, size / 2);
    for (const [o, col] of stops) g.addColorStop(o, col);
    x.fillStyle = g; x.fillRect(0, 0, size, size);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    return t;
}
const flameTex = radialTex([
    [0, 'rgba(255,255,235,1)'], [0.2, 'rgba(255,216,130,0.95)'],
    [0.5, 'rgba(255,130,40,0.5)'], [1, 'rgba(255,60,10,0)'],
]);
const glowTex = radialTex([
    [0, 'rgba(190,255,215,0.9)'], [0.35, 'rgba(90,230,150,0.35)'], [1, 'rgba(40,180,100,0)'],
]);

function flame(scale = 0.5, parent, pos) {

}

/* bubbles */
const N_BUB = 30;
const bubPos = new Float32Array(N_BUB * 3);
const bubSeed = new Float32Array(N_BUB);
for (let i = 0; i < N_BUB; i++) {
    bubSeed[i] = Math.random() * Math.PI * 2;
    bubPos[i * 3 + 1] = Math.random() * 0.5;
}
const bubGeo = new THREE.BufferGeometry();

    color: 0x9dffd0, size: 0.045, map: glowTex, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false,
}));
cauldron.add(bubbles);
let bubbleBoost = 0;

function updateBubbles(dt, t) {
    const a = bubbles.geometry.attributes.position.array;
    const boost = 1 + bubbleBoost * 5;
    bubbleBoost *= Math.exp(-1.6 * dt);
    for (let i = 0; i < N_BUB; i++) {
        const s = bubSeed[i];
        a[i * 3 + 1] += dt * (0.14 + (s * 7 % 1) * 0.18) * boost;
        if (a[i * 3 + 1] > 0.6) a[i * 3 + 1] = 0.02;
        const r = (0.12 + (s * 13 % 1) * 0.72) * brothR;
        a[i * 3] = Math.cos(s + t * 0.6 + a[i * 3 + 1]) * r;
        a[i * 3 + 2] = Math.sin(s * 1.7 + t * 0.5 + a[i * 3 + 1]) * r;
    }
    bubbles.geometry.attributes.position.needsUpdate = true;
}

/* ═══════════════════════════════════════════════════════════════════════
   THE BREW  —  custom shader surface
   ═══════════════════════════════════════════════════════════════════════ */
const brewUniforms = { uTime: { value: 0 } };
const brewMat = new THREE.ShaderMaterial({
    uniforms: brewUniforms,
    transparent: true, depthWrite: false,
    vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
        uniform float uTime;
        varying vec2 vUv;
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
            vec2 i = floor(p), f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
                       mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
        }
        float fbm(vec2 p) {
            float v = 0.0, a = 0.5;
            for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }
            return v;
        }
        void main() {
            vec2 p = vUv * 2.0 - 1.0;
            float r = length(p);
            float ang = atan(p.y, p.x) + uTime * 0.35 * (1.6 - r);
            vec2 q = vec2(cos(ang), sin(ang)) * r;
            float n = fbm(q * 3.2 + vec2(uTime * 0.22, -uTime * 0.17));
            n += 0.5 * fbm(q * 6.5 - vec2(uTime * 0.4, uTime * 0.1));
            vec3 deep = vec3(0.012, 0.09, 0.055);
            vec3 mid  = vec3(0.10, 0.62, 0.34);
            vec3 hi   = vec3(0.62, 1.0, 0.78);
            vec3 col = mix(deep, mid, smoothstep(0.25, 0.75, n));
            col = mix(col, hi, smoothstep(0.78, 0.98, n));
            col += hi * smoothstep(0.92, 1.0, r) * 0.6;
            float alpha = smoothstep(1.0, 0.94, r) * 0.96;
            gl_FragColor = vec4(col * 1.35, alpha);
        }`,
});

/* ═══════════════════════════════════════════════════════════════════════
   RUNE CIRCLE on the floor beneath the bench
   ═══════════════════════════════════════════════════════════════════════ */
const runeTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const x = c.getContext('2d');
    x.clearRect(0, 0, 512, 512);
    x.strokeStyle = 'rgba(120,255,180,0.9)';
    x.lineWidth = 4;
    x.beginPath(); x.arc(256, 256, 236, 0, Math.PI * 2); x.stroke();
    x.lineWidth = 2;
    x.beginPath(); x.arc(256, 256, 214, 0, Math.PI * 2); x.stroke();
    x.beginPath(); x.arc(256, 256, 120, 0, Math.PI * 2); x.stroke();
    /* inner triangle-ish star */
    x.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
        const a0 = (i / 3) * Math.PI * 2 - Math.PI / 2;
        const a1 = ((i + 1) / 3) * Math.PI * 2 - Math.PI / 2;
        x.beginPath();
        x.moveTo(256 + Math.cos(a0) * 200, 256 + Math.sin(a0) * 200);
        x.lineTo(256 + Math.cos(a1) * 200, 256 + Math.sin(a1) * 200);
        x.stroke();
    }
    /* rune glyphs around the middle ring */
    x.lineWidth = 5; x.lineCap = 'round';
    for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2;
        const cx = 256 + Math.cos(a) * 168, cy = 256 + Math.sin(a) * 168;
        x.save(); x.translate(cx, cy); x.rotate(a + Math.PI / 2);
        x.beginPath();
        const n = 2 + (i % 3);
        for (let s = 0; s < n; s++) {
            x.moveTo(-10, -8 + s * 9);
            x.lineTo(10, (s % 2 ? -8 : 8) + s * 9);
        }
        x.stroke();
        x.restore();
    }
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
})();

function buildScrollTexture() {
    const c = document.createElement('canvas'); c.width = 512; c.height = 310;
    const x = c.getContext('2d');
    /* parchment — kept below the bloom threshold */
    x.fillStyle = '#cbb78d'; x.fillRect(0, 0, 512, 310);
    for (let i = 0; i < 14; i++) {

    x.strokeStyle = 'rgba(90,62,24,0.55)'; x.lineWidth = 3;
    x.strokeRect(14, 14, 512 - 28, 310 - 28);
    x.lineWidth = 1.5;
    x.strokeRect(24, 24, 512 - 48, 310 - 48);
    x.textAlign = 'center';
    x.fillStyle = '#3d2710';
    x.font = '600 30px "Grenze Gotisch", serif';
    x.fillText(COPY.scroll.title, 256, 52);
    x.strokeStyle = 'rgba(90,62,24,0.4)';
    x.beginPath(); x.moveTo(170, 66); x.lineTo(342, 66); x.stroke();
    x.fillStyle = '#2e2113';
    x.font = '19px "IM Fell English", serif';
    let y = 96;
    for (const l of COPY.scroll.lines) {
        if (l === '') { y += 12; continue; }
        y = wrapText(x, l, 256, y, 400, 24, 'center');
    }
    x.fillStyle = '#4a381a';
    x.font = 'italic 17px "IM Fell English", serif';
    x.fillText(COPY.scroll.signature, 256, y + 8);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = Math.min(maxAniso, 4);
    scrollPaper.material.map = t;
    scrollPaper.material.needsUpdate = true;
}

/* parchment page canvas + text helpers */
function pageCanvas() {
    const c = document.createElement('canvas'); c.width = 512; c.height = 668;
    const x = c.getContext('2d');
    x.fillStyle = '#bfae8a'; x.fillRect(0, 0, 512, 668);
    for (let i = 0; i < 12; i++) {
        x.fillStyle = `rgba(120,90,40,${0.04 + Math.random() * 0.05})`;
        x.beginPath(); x.arc(Math.random() * 512, Math.random() * 668, 10 + Math.random() * 34, 0, Math.PI * 2); x.fill();
    }
    x.strokeStyle = 'rgba(74,47,18,0.32)'; x.lineWidth = 3;
    x.strokeRect(18, 18, 512 - 36, 668 - 36);
    return [c, x];
}
function wrapText(x, text, cx, y, maxW, lineH, align = 'left') {
    const words = text.split(' ');
    let line = '';
    const draw = yy => { if (align === 'center') x.fillText(line, cx, yy); else x.fillText(line, cx, yy); };
    for (const w of words) {
        const t = line ? line + ' ' + w : w;
        if (x.measureText(t).width > maxW && line) { draw(y); y += lineH; line = w; }
        else line = t;
    }
    if (line) { draw(y); y += lineH; }
    return y;
}
function pageNum(x, n) {
    x.fillStyle = '#6b4f26'; x.font = 'italic 22px "IM Fell English", serif';
    x.textAlign = 'center'; x.fillText(`— ${n} —`, 256, 640);
}
function drawIntroLeft() {
    const [c, x] = pageCanvas();
    x.textAlign = 'center';
    x.fillStyle = '#3d2710';
    x.font = '600 64px "Grenze Gotisch", serif';
    wrapText(x, COPY.tome.title, 256, 200, 420, 72, 'center');
    x.font = '30px "IM Fell English", serif';
    x.fillStyle = '#7d5f2c';
    x.fillText('✦', 256, 330);
    x.fillStyle = '#2e2113';
    x.font = 'italic 26px "IM Fell English", serif';
    let y = 400;
    for (const l of COPY.tome.intro) { y = wrapText(x, l, 256, y, 380, 34, 'center'); }
    x.font = 'italic 26px "IM Fell English", serif';
    x.fillStyle = '#4a381a';
    x.fillText(COPY.tome.signature, 256, y + 26);
    pageNum(x, 1);
    return c;
}
function drawIntroRight() {
    const [c, x] = pageCanvas();
    x.textAlign = 'center';
    x.strokeStyle = 'rgba(90,62,24,0.5)'; x.lineWidth = 2;
    x.beginPath(); x.arc(256, 260, 130, 0, Math.PI * 2); x.stroke();
    x.beginPath(); x.arc(256, 260, 110, 0, Math.PI * 2); x.stroke();
    x.fillStyle = '#3d2710';
    x.font = '600 40px "Grenze Gotisch", serif';
    x.fillText('℞', 256, 262);
    x.fillStyle = '#4a381a';
    x.font = 'italic 26px "IM Fell English", serif';
    wrapText(x, "Read the leaves, not the writing.", 256, 480, 360, 34, 'center');
    pageNum(x, 2);
    return c;
}
function drawRecipeLeft(r) {
    const [c, x] = pageCanvas();
    x.textAlign = 'center';
    x.fillStyle = '#3d2710';
    x.font = '600 44px "Grenze Gotisch", serif';
    wrapText(x, r.title, 256, 84, 430, 50, 'center');
    x.strokeStyle = 'rgba(90,62,24,0.55)'; x.lineWidth = 2;
    x.beginPath(); x.moveTo(140, 118); x.lineTo(372, 118); x.stroke();
    x.font = 'italic 24px "IM Fell English", serif';
    x.fillStyle = '#6b4f26';
    if (r.serves) x.fillText(`${COPY.tome.serves} ${r.serves}`, 256, 150);
    x.fillStyle = '#2e2113';
    x.font = '26px "IM Fell English", serif';
    x.fillText('✦ ' + COPY.tome.ingredients + ' ✦', 256, 196);
    x.textAlign = 'left';
    x.font = '26px "IM Fell English", serif';
    let y = 250;
    for (const ing of (r.ingredients || [])) {
        x.fillStyle = '#7d5f2c'; x.fillText('✦', 44, y);
        x.fillStyle = '#2e2113';
        y = wrapText(x, ing, 74, y, 392, 36);
        y += 8;
    }
    pageNum(x, r._n * 2 + 1);
    return c;
}
function drawRecipeRight(r) {
    const [c, x] = pageCanvas();
    x.textAlign = 'center';
    x.fillStyle = '#2e2113';
    x.font = '26px "IM Fell English", serif';
    x.fillText('✦ ' + COPY.tome.method + ' ✦', 256, 70);
    x.textAlign = 'left';
    x.font = '25px "IM Fell English", serif';
    let y = 130;
    (r.steps || []).forEach((s, i) => {
        x.fillStyle = '#7d5f2c';
        x.font = 'italic 25px "IM Fell English", serif';
        x.fillText(`${i + 1}.`, 44, y);
        x.fillStyle = '#2e2113';
        x.font = '25px "IM Fell English", serif';
        y = wrapText(x, s, 84, y, 372, 34);
        y += 14;
    });
    if (r.note) {
        x.textAlign = 'center';
        x.fillStyle = '#5e4722';
        x.font = 'italic 24px "IM Fell English", serif';
        y = wrapText(x, r.note, 256, Math.max(y + 12, 560), 400, 32, 'center');
    }
    pageNum(x, r._n * 2 + 2);
    return c;
}
function texFromCanvas(c) {
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = Math.min(maxAniso, 4);
    return t;
}
const bookSpreads = [];                 /* { L, R } canvas textures per spread */
function buildBookTextures() {
    bookSpreads.length = 0;
    bookSpreads.push({ L: texFromCanvas(drawIntroLeft()), R: texFromCanvas(drawIntroRight()) });
    RECIPES.forEach((r, i) => {
        r._n = i + 1;
        bookSpreads.push({ L: texFromCanvas(drawRecipeLeft(r)), R: texFromCanvas(drawRecipeRight(r)) });
    });
}

    fragmentShader: /* glsl */`
        uniform sampler2D frontTex, backTex;
        varying vec2 vUv;
        void main() {
            vec3 tint = vec3(1.25, 1.2, 1.1);
            if (gl_FrontFacing) gl_FragColor = vec4(texture2D(frontTex, vUv).rgb * tint, 1.0);
            else gl_FragColor = vec4(texture2D(backTex, vec2(1.0 - vUv.x, vUv.y)).rgb * tint, 1.0);

});

function glowProp(url, pos, baseY, height, col, emis, rotY = 0) {
    prop(url, { pos, baseY, height, rotY }, m => {
        if (!m) return;
        m.traverse(o => {
            if (o.isMesh && o.material) {
                o.material = o.material.clone();
                o.material.emissive = new THREE.Color(emis);
                o.material.emissiveIntensity = 1.05;
            }
        });
    });
}

function motes(count, opts) {
    const pos = new Float32Array(count * 3);
    const seed = new Float32Array(count);
    for (let i = 0; i < count; i++) {
        pos[i * 3] = opts.x0 + (Math.random() - 0.5) * opts.sx;
        pos[i * 3 + 1] = opts.y0 + Math.random() * opts.sy;
        pos[i * 3 + 2] = opts.z0 + (Math.random() - 0.5) * opts.sz;
        seed[i] = Math.random() * 6.28;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({
        color: opts.color, size: opts.size, map: dustTex, transparent: true,
        opacity: opts.opacity, blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    scene.add(pts);
    return { pts, seed, opts };
}

function updateMotes(sys, dt, t, drift) {
    const a = sys.pts.geometry.attributes.position.array;
    for (let i = 0; i < sys.seed.length; i++) {
        const s = sys.seed[i];
        a[i * 3 + 1] += Math.sin(t * 0.4 + s) * dt * drift;
        a[i * 3] += Math.cos(t * 0.25 + s * 1.7) * dt * drift * 0.6;
        a[i * 3 + 2] += Math.sin(t * 0.3 + s * 0.6) * dt * drift * 0.4;
        const o = sys.opts;
        if (a[i * 3 + 1] < o.y0) a[i * 3 + 1] = o.y0 + o.sy;
        if (a[i * 3 + 1] > o.y0 + o.sy) a[i * 3 + 1] = o.y0;
    }
    sys.pts.geometry.attributes.position.needsUpdate = true;
}

/* ═══════════════════════════════════════════════════════════════════════
   CAMERA RIG — fixed cinematic poses, eased flights, parallax + zoom
   ═══════════════════════════════════════════════════════════════════════ */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const portraitMode = innerWidth / innerHeight < 0.85;
const POSES = {
    overview: { pos: V3(0.05, 3.55, 0.95), look: V3(-0.05, 1.02, -1.9), fov: 52 },
    scroll:   { pos: V3(0.3, 1.78, -0.9), look: V3(0.32, 1.06, BZ + 0.27), fov: 42 },
    tome: portraitMode
        ? { pos: V3(LEC.x, TOP_Y + 1.15, BZ + 0.78), look: V3(LEC.x, TOP_Y + 0.2, LEC.z), fov: 48 }
        : { pos: V3(LEC.x + 0.03, TOP_Y + 0.8, BZ + 0.55), look: V3(LEC.x, TOP_Y + 0.2, LEC.z), fov: 42 },
    cauldron: { pos: V3(-1.15, 2.6, -0.35), look: V3(-0.72, 1.42, BZ + 0.02), fov: 46 },
    skull:    { pos: V3(-1.42, 2.35, -0.35), look: V3(-1.42, 1.1, BZ + 0.15), fov: 42 },
};

const rig = {
    cur: { pos: POSES.overview.pos.clone(), look: POSES.overview.look.clone(), fov: POSES.overview.fov },
    from: null, to: null, t: 1, dur: 1.7,
    yaw: 0, pitch: 0, zoom: -0.35,       // smoothed offsets (slight zoom-in by default)
    yawT: 0, pitchT: 0, zoomT: -0.35,    // targets from input
    focus: null,
};
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function flyTo(name, dur = 1.7) {
    const p = POSES[name];
    rig.from = { pos: rig.cur.pos.clone(), look: rig.cur.look.clone(), fov: rig.cur.fov };
    rig.to = { pos: p.pos.clone(), look: p.look.clone(), fov: p.fov };
    rig.t = 0; rig.dur = reducedMotion ? 0.01 : dur;
}
function updateRig(dt, t) {
    if (rig.to && rig.t < 1) {
        rig.t = Math.min(1, rig.t + dt / rig.dur);
        const e = easeInOut(rig.t);
        rig.cur.pos.lerpVectors(rig.from.pos, rig.to.pos, e);
        rig.cur.look.lerpVectors(rig.from.look, rig.to.look, e);
        rig.cur.fov = rig.from.fov + (rig.to.fov - rig.from.fov) * e;
    }
    /* input offsets ease toward targets */
    const k = 1 - Math.exp(-6 * dt);
    rig.yaw += (rig.yawT - rig.yaw) * k;
    rig.pitch += (rig.pitchT - rig.pitch) * k;
    rig.zoom += (rig.zoomT - rig.zoom) * k;

    /* idle sway */
    const sway = reducedMotion ? 0 : (rig.focus ? 0.25 : 1);
    const swx = Math.sin(t * 0.11) * 0.1 * sway;
    const swy = Math.sin(t * 0.16 + 1.3) * 0.05 * sway;

    const range = rig.focus ? 0.35 : 1;
    camera.position.copy(rig.cur.pos);
    camera.position.x += swx; camera.position.y += swy;
    camera.lookAt(rig.cur.look);
    camera.rotateY(rig.yaw * range);
    camera.rotateX(rig.pitch * range);
    camera.translateZ(rig.zoom);
    if (Math.abs(camera.fov - rig.cur.fov) > 0.05) {
        camera.fov = rig.cur.fov; camera.updateProjectionMatrix();
    }
}

/* ── pointer input: parallax, pinch zoom, tap detection ── */
let downPos = null, downTime = 0, dragged = false;
let pinchD0 = 0, pinchZoom0 = 0, lastPX = 0, lastPY = 0;
const pointer = { x: 0.5, y: 0.5 };

addEventListener('pointermove', e => {
    pointer.x = e.clientX / innerWidth; pointer.y = e.clientY / innerHeight;
    if (!IS_TOUCH) {
        rig.yawT = -(pointer.x - 0.5) * 0.15;
        rig.pitchT = (pointer.y - 0.5) * 0.09;
    }
    if (downPos) {
        const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
        if (Math.hypot(dx, dy) > 9) dragged = true;
        if (IS_TOUCH && e.pointerType === 'touch' && pinchD0 === 0) {
            rig.yawT = THREE.MathUtils.clamp(rig.yawT - (e.clientX - lastPX) * 0.0024, -0.22, 0.22);
            rig.pitchT = THREE.MathUtils.clamp(rig.pitchT - (e.clientY - lastPY) * 0.0015, -0.13, 0.13);
        }
    }
    lastPX = e.clientX; lastPY = e.clientY;
    hoverCheck(e.clientX, e.clientY);
});
renderer.domElement.addEventListener('pointerdown', e => {
    downPos = { x: e.clientX, y: e.clientY }; downTime = performance.now(); dragged = false;
    if (e.pointerType === 'touch') {
        const t2 = [...e.targetTouches].find(t => t.identifier !== e.pointerId);
        if (t2) pinchD0 = Math.hypot(e.clientX - t2.clientX, e.clientY - t2.clientY), pinchZoom0 = rig.zoomT;
    }
});
addEventListener('pointerup', e => {
    if (pinchD0 > 0) {
        pinchD0 = 0;
    } else if (downPos && !dragged && performance.now() - downTime < 600 && e.target === renderer.domElement) {
        clickCheck(e.clientX, e.clientY);
    }
    downPos = null;
});
addEventListener('pointercancel', () => { downPos = null; pinchD0 = 0; });
renderer.domElement.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchD0 > 0) {
        e.preventDefault();
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                             e.touches[0].clientY - e.touches[1].clientY);
        const s = pinchD0 / Math.max(d, 1);
        rig.zoomT = THREE.MathUtils.clamp(Math.min(0, pinchZoom0 + (1 - s) * -3.2), -2.2, 0.05);
    }
}, { passive: false });
addEventListener('wheel', e => {
    rig.zoomT = THREE.MathUtils.clamp(rig.zoomT + e.deltaY * 0.0021, -2.2, 0.05);
}, { passive: true });
addEventListener('keydown', e => {
    if (bookMode && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        turnPage(e.key === 'ArrowRight' ? 1 : -1);
        return;
    }
    if (e.key === 'Escape' && rig.focus) goOverview();
});

    markersRoot.appendChild(el);

const projV = new THREE.Vector3();
function updateMarkers() {
    const showAll = started && !rig.focus;
    for (const [k, s] of Object.entries(SPOTS)) {
        const el = markers[k];
        if (!showAll) { el.classList.remove('on'); continue; }
        projV.copy(s.anchor).project(camera);
        if (projV.z > 1 || projV.z < -1) { el.classList.remove('on'); continue; }
        el.style.left = `${(projV.x * 0.5 + 0.5) * innerWidth}px`;
        el.style.top = `${(-projV.y * 0.5 + 0.5) * innerHeight}px`;
        el.classList.add('on');
    }
}

function pick(cx, cy) {
    raycaster.setFromCamera(new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1), camera);
    const hits = raycaster.intersectObjects(Object.values(SPOTS).map(s => s.hit), false);
    return hits.length ? hits[0].object.userData.spot : null;
}
let hoverSpot = null;
let hoverTick = 0;
function hoverCheck(cx, cy) {
    if (IS_TOUCH || !started || (hoverTick++ & 1)) return;
    const k = pick(cx, cy);
    if (k !== hoverSpot) {
        if (hoverSpot) markers[hoverSpot].classList.remove('hot');
        hoverSpot = k;
        if (hoverSpot) markers[hoverSpot].classList.add('hot');
        renderer.domElement.style.cursor = hoverSpot ? 'pointer' : 'default';
    }
}
function clickCheck(cx, cy) {
    if (!started) return;
    if (bookMode) {
        raycaster.setFromCamera(new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1), camera);
        const hits = raycaster.intersectObjects([leftPage, rightPage], false);
        if (hits.length) turnPage(hits[0].object === rightPage ? 1 : -1);
        return;
    }
    if (rig.focus) return;
    const k = pick(cx, cy);
    if (!k) return;
    focusSpot(k);
}
function focusSpot(k) {
    rig.focus = k;
    flyTo(k, 1.8);
    backBtn.classList.add('show');
    audio.stinger(k);
    if (k === 'cauldron') {
        bubbleBoost = 1.6;
        brothLight.intensity = 26;
        audio.flare();
    }
    if (COPY.flavor[k]) showToast(COPY.flavor[k], 3600);
    const arrive = () => {
        if (k === 'tome') enterBookMode();
    };
    setTimeout(() => { if (rig.focus === k) arrive(); }, reducedMotion ? 60 : 1850);
}
function goOverview() {
    rig.focus = null;
    exitBookMode();
    flyTo('overview', 1.6);
    backBtn.classList.remove('show');
}

/* ═══════════════════════════════════════════════════════════════════════
   READING VIEWS — in-scene scroll + tome
   ═══════════════════════════════════════════════════════════════════════ */
/* — the tome: in-scene page turning, no popup — */
let spreadIdx = 0, bookMode = false;
const flipState = { active: false, dir: 0, t: 0, dur: 0.72, target: 0 };

function updateBookCounter() {
    $('bookCount').textContent = `${spreadIdx + 1} / ${bookSpreads.length}`;
    $('pagePrev').disabled = spreadIdx === 0;
    $('pageNext').disabled = spreadIdx >= bookSpreads.length - 1;
}
function enterBookMode() {
    bookMode = true;
    showSpread(spreadIdx);
    updateBookCounter();
    $('bookNav').classList.add('show');
    showToast(COPY.tome.toast, 2400);
}
function exitBookMode() {
    if (!bookMode) return;
    bookMode = false;
    $('bookNav').classList.remove('show');
}
function turnPage(dir) {
    if (flipState.active || !bookMode) return;
    const ni = spreadIdx + dir;
    if (ni < 0 || ni >= bookSpreads.length) return;
    flipState.active = true; flipState.dir = dir; flipState.t = 0; flipState.target = ni;
    audio.pageTurn();
    const cur = bookSpreads[spreadIdx];
    const nxt = bookSpreads[ni];
    if (dir > 0) {
        leafUniforms.frontTex.value = cur.R;
        leafUniforms.backTex.value = nxt.L;
        leaf.rotation.y = 0;
    } else {
        leafUniforms.frontTex.value = nxt.R;
        leafUniforms.backTex.value = cur.L;
        leaf.rotation.y = -Math.PI;
    }
    leaf.visible = true;
}
function updatePageFlip(dt) {
    if (!flipState.active) return;
    flipState.t += dt / flipState.dur;
    const e = easeInOut(Math.min(flipState.t, 1));
    leaf.rotation.y = flipState.dir > 0 ? -e * Math.PI : -Math.PI + e * Math.PI;
    leaf.position.y = 0.02 + Math.sin(e * Math.PI) * 0.11;
    if (flipState.t >= 1) {
        flipState.active = false;
        spreadIdx = flipState.target;
        showSpread(spreadIdx);
        leaf.visible = false;
        updateBookCounter();
    }
}
$('pagePrev').addEventListener('click', () => turnPage(-1));
$('pageNext').addEventListener('click', () => turnPage(1));

/* ═══════════════════════════════════════════════════════════════════════
   AUDIO — procedural dungeon ambience (WebAudio)
   ═══════════════════════════════════════════════════════════════════════ */
const audio = (() => {
    let ctx = null, master = null, muted = false;
    function noiseBuf() {
        const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        const d = b.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        return b;
    }
    function init() {
        if (ctx) { ctx.resume(); return; }
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();
        master.gain.value = 0;
        master.connect(ctx.destination);
        master.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 3);

        /* low drone */
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 150;
        const dg = ctx.createGain(); dg.gain.value = 0.14;
        [[46, 'sine', 0.6], [49.2, 'sine', 0.4], [92.5, 'triangle', 0.16]].forEach(([f, ty, g]) => {
            const o = ctx.createOscillator(); o.type = ty; o.frequency.value = f;
            const og = ctx.createGain(); og.gain.value = g;
            o.connect(og); og.connect(lp); o.start();
        });
        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.05;
        const lfoG = ctx.createGain(); lfoG.gain.value = 60;
        lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
        lp.connect(dg); dg.connect(master);

        /* room air */
        const nb = noiseBuf();
        const air = ctx.createBiquadFilter(); air.type = 'bandpass'; air.frequency.value = 420; air.Q.value = 0.6;
        const airG = ctx.createGain(); airG.gain.value = 0.028;
        const aSrc = ctx.createBufferSource(); aSrc.buffer = nb; aSrc.loop = true;
        aSrc.connect(air); air.connect(airG); airG.connect(master); aSrc.start();
        const wlfo = ctx.createOscillator(); wlfo.frequency.value = 0.07;
        const wlfoG = ctx.createGain(); wlfoG.gain.value = 0.014;
        wlfo.connect(wlfoG); wlfoG.connect(airG.gain); wlfo.start();

        /* fire crackle */
        const cf = ctx.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 2900; cf.Q.value = 0.8;
        const cG = ctx.createGain(); cG.gain.value = 0;
        const cSrc = ctx.createBufferSource(); cSrc.buffer = nb; cSrc.loop = true;
        cSrc.connect(cf); cf.connect(cG); cG.connect(master); cSrc.start();
        (function crackleLoop() {
            if (!ctx) return;
            const t = ctx.currentTime;
            const g = 0.012 + Math.random() * 0.045 * (Math.random() < 0.25 ? 2.4 : 1);
            cG.gain.setTargetAtTime(g, t, 0.015);
            setTimeout(() => { if (ctx) cG.gain.setTargetAtTime(0.004, ctx.currentTime, 0.06); },
                40 + Math.random() * 110);
            setTimeout(crackleLoop, 110 + Math.random() * 130);
        })();

        /* drips */
        (function dripLoop() {
            if (!ctx) return;
            const t = ctx.currentTime;
            const o = ctx.createOscillator(); o.type = 'sine';
            o.frequency.setValueAtTime(820 + Math.random() * 500, t);
            o.frequency.exponentialRampToValueAtTime(220, t + 0.14);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0, t);
            g.gain.linearRampToValueAtTime(0.05, t + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
            o.connect(g); g.connect(master);
            o.start(t); o.stop(t + 0.35);
            setTimeout(dripLoop, 6000 + Math.random() * 12000);
        })();
    }
    function env(g, peak, a, d, t) {
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(peak, t + a);
        g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    }
    return {
        init,
        get muted() { return muted; },
        toggleMute() {
            muted = !muted;
            if (master) master.gain.setTargetAtTime(muted ? 0 : 0.5, ctx.currentTime, 0.1);
            return muted;
        },
        bell() {
            if (!ctx || muted) return;
            const t = ctx.currentTime;
            [523.25, 784].forEach((f, i) => {
                const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
                const g = ctx.createGain();
                env(g, 0.05 / (i + 1), 0.012, 1.4, t + i * 0.09);
                o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.6);
            });
        },
        pageTurn() {
            if (!ctx || muted) return;
            const t = ctx.currentTime;
            const s = ctx.createBufferSource(); s.buffer = noiseBuf();
            const f = ctx.createBiquadFilter(); f.type = 'bandpass';
            f.frequency.setValueAtTime(900, t);
            f.frequency.exponentialRampToValueAtTime(2400, t + 0.12);
            const g = ctx.createGain(); env(g, 0.07, 0.02, 0.14, t);
            s.connect(f); f.connect(g); g.connect(master);
            s.start(t); s.stop(t + 0.2);
        },
        flare() {
            if (!ctx || muted) return;
            const t = ctx.currentTime;
            const s = ctx.createBufferSource(); s.buffer = noiseBuf();
            const f = ctx.createBiquadFilter(); f.type = 'bandpass';
            f.frequency.setValueAtTime(300, t);
            f.frequency.exponentialRampToValueAtTime(1800, t + 0.5);
            f.Q.value = 2.5;
            const g = ctx.createGain(); env(g, 0.09, 0.06, 0.55, t);
            s.connect(f); f.connect(g); g.connect(master);
            s.start(t); s.stop(t + 0.7);
        },
        stinger(k) {
            if (!ctx || muted) return;
            const t = ctx.currentTime;
            const notes = { scroll: [392, 523.25], tome: [329.6, 493.9], cauldron: [196, 246.9], skull: [220, 261.6] };
            (notes[k] || [330]).forEach((f, i) => {
                const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
                const g = ctx.createGain(); env(g, 0.035, 0.05, 0.7, t + i * 0.07);
                o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.9);
            });
        },
    };
})();
muteBtn.addEventListener('click', () => {
    const m = audio.toggleMute();
    muteBtn.textContent = m ? '⏧' : '♪';
    muteBtn.style.opacity = 0.6;
});

/* ═══════════════════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let started = false, fpsAcc = 0, fpsN = 0, fpsLow = 0, dprLevel = 0;

function updateTorches(t) {
    for (const tc of torches) {
        const fl = 0.82 + 0.15 * Math.sin(t * tc.f1 + tc.p1)
                 + 0.07 * Math.sin(t * tc.f2 + tc.p2)
                 + 0.04 * Math.sin(t * 23.7 + tc.p1 * 3);
        if (tc.light) tc.light.intensity = tc.base * fl;
        tc.flame.scale.setScalar(0.42 + 0.09 * Math.sin(t * tc.f1 * 1.4 + tc.p2) + Math.random() * 0.035);
        tc.flame.material.opacity = 0.85 + 0.13 * Math.sin(t * tc.f2 + tc.p1);
        tc.cone.material.opacity = 0.75 + 0.25 * Math.sin(t * tc.f1 * 0.7 + tc.p1);
    }
}

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    updateRig(dt, t);
    updateTorches(t);
    updateMotes(dust, dt, t, 0.12);
    updateMotes(embers, dt, t, 0.35);

    /* cauldron life */
    if (cauldronReady) {
        brewDisc.position.y = rimY - 0.05;
        brewDisc.scale.setScalar(brothR);
        bubbles.position.y = rimY - 0.15;
        brothLight.position.y = rimY + 1.15;
    }
    brewUniforms.uTime.value = t;
    brewDisc.rotation.z = t * 0.05;
    const pulse = 1 + Math.sin(t * 1.6) * 0.12 + Math.sin(t * 4.1) * 0.05;
    brothLight.intensity += ((9 * pulse) - brothLight.intensity) * Math.min(1, dt * 3);
    updateBubbles(dt, t);
    updateSteam(t);

    /* floating crystal: bob + spin + halo breath */
    crystal.position.y = TOP_Y + 1.35 + Math.sin(t * 0.9) * 0.08;
    crystal.userData.gem.rotation.y = t * 0.7;
    crystal.userData.gem.rotation.x = Math.sin(t * 0.5) * 0.2;
    crystal.userData.halo.material.opacity = 0.3 + Math.sin(t * 1.3) * 0.12;
    crystalLight.intensity = 1.8 + Math.sin(t * 1.3) * 0.5;

    /* rune circle: slow spin + glow pulse */
    runeCircle.rotation.z = t * 0.04;
    runeCircle.material.opacity = 0.42 + Math.sin(t * 0.8) * 0.14;
    runeGlow.intensity = 1.7 + Math.sin(t * 0.8) * 0.5;

    /* lantern + key light breathing */
    lanternLight.intensity = 2.7 + Math.sin(t * 1.1) * 0.4 + Math.sin(t * 5.3) * 0.15;
    benchKey.intensity = 5.5 + Math.sin(t * 0.9) * 0.5;

    /* bench candles */
    for (const f of benchFlames) {
        f.scale.setScalar(0.22 + Math.sin(t * 11 + f.position.x * 7) * 0.05 + Math.random() * 0.02);
        f.material.opacity = 0.8 + Math.sin(t * 13 + f.position.z * 5) * 0.15;
    }
    /* reading mode: keep the book crisp — soften bloom & grain, light the page */
    const bloomTarget = bookMode ? 0.18 : 0.55;
    bloom.strength += (bloomTarget - bloom.strength) * Math.min(1, dt * 3);
    const grainTarget = bookMode ? 0.015 : 0.05;
    gradePass.uniforms.uGrain.value += (grainTarget - gradePass.uniforms.uGrain.value) * Math.min(1, dt * 3);
    tomeLight.intensity = (bookMode ? 1.2 : 0.75) + Math.sin(t * 2.3) * 0.15;
    skullLight.intensity = 2.2 + Math.sin(t * 1.7) * 0.45;
    updatePageFlip(dt);

    updateMarkers();
    gradePass.uniforms.uTime.value = t;
    composer.render();

    /* adaptive quality */
    fpsAcc += dt; fpsN++;
    if (fpsAcc >= 1) {
        const fps = fpsN / fpsAcc;
        fpsAcc = 0; fpsN = 0;
        if (fps < 26 && dprLevel < 2 && started) {
            fpsLow++;
            if (fpsLow >= 3) {
                dprLevel++; fpsLow = 0;
                DPR = Math.max(0.75, DPR * 0.78);
                renderer.setPixelRatio(DPR);
                composer.setSize(innerWidth, innerHeight);
                if (dprLevel >= 2) gradePass.uniforms.uGrain.value = 0.02;
            }
        } else fpsLow = 0;
    }
}

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
});

/* ═══════════════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════════════ */
let assetsDone = false, fontsDone = false;
function tryReady() {
    if (assetsDone && fontsDone && !enterBtn.style.display) {
        bar.style.width = '100%';
        barLabel.textContent = COPY.loadingFonts;
        setTimeout(() => { enterBtn.style.display = 'inline-block'; }, 350);
    }
}
manager.onLoad = () => { assetsDone = true; tryReady(); };
manager.onError = url => { console.warn('asset failed (fallback in place):', url); };
setTimeout(() => { assetsDone = true; tryReady(); }, 25000);   // never block entry
if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
        fontsDone = true; tryReady();
        buildBookTextures();          /* redraw tome pages with the real fonts */
        buildScrollTexture();         /* redraw the scroll with the real fonts */
        showSpread(spreadIdx);
    });
    setTimeout(() => { fontsDone = true; tryReady(); }, 5000);
} else fontsDone = true;

enterBtn.addEventListener('click', () => {
    started = true;
    veil.classList.add('gone');
    audio.init();
    muteBtn.classList.add('show');
    hintEl.classList.add('show');
    setTimeout(() => hintEl.classList.remove('show'), 7000);
    setTimeout(() => showToast(COPY.enterToast, 4200), 1600);
    flyTo('overview', 0.01);
    rig.t = 1;
});

/* pre-render one frame behind the veil so entry is instant */
animate();
