<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <meta name="description" content="{{ .Description }}" />

    <!-- OpenGraph tags -->
    <meta property="og:title" content="{{ .Title }}" />
    <meta property="og:description" content="{{ .Description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta property="og:image" content="{{ with .Params.images }}{{ ($.Page.Resources.GetMatch (index . 0)).Permalink }}{{ else }}{{ .Site.Params.defaultImage | absURL }}{{ end }}" />    
    <meta property="og:site_name" content="{{ .Site.Title }}" />
    <meta property="og:locale" content="{{ .Site.Language.Locale }}" />

    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ .Title }}">
    <meta name="twitter:description" content="{{ .Description }}">
    <meta name="twitter:image" content="{{ with .Params.images }}{{ ($.Page.Resources.GetMatch (index . 0)).Permalink }}{{ else }}{{ .Site.Params.defaultImage | absURL }}{{ end }}">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}" />
    <link rel="stylesheet" href="{{ "css/fonts.css" | relURL }}" />

    <!-- Custom head content -->
    {{ partial "head_custom.html" . }}

    <!-- Favicon -->
    {{ with .Site.Params.favicon }}
    <link rel="icon" type="image/png" href="/favicon.png">
    {{ end }}
  </head>
  <body>
    <header class="letterhead">
      <div class="letterhead-brand">
        <div class="clown-container">{{ partial "clown.html" . }}</div>
        <h1 class="site-title"><a href="{{ .Site.Home.RelPermalink }}">Torbjørn Bakken Pedersen's page</a></h1>
      </div>
      <p class="site-contact">
        {{ range $i, $item := .Site.Params.contact }}{{ if $i }}<span class="sep">·</span>{{ end }}<a href="{{ $item.url }}">{{ $item.label }}</a>{{ end }}
        {{ if .Site.Params.contact }}<span class="sep">·</span>{{ end }}<a href="{{ "index.xml" | relURL }}">RSS</a>
      </p>
    </header>
