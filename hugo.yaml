baseurl: "https://torbjorn.no/"
locale: "en-us"
title: "Torbjørn Bakken Pedersen's home page"
ignoreFiles: ["_cache$"]
footnotereturnlinkcontents: "↩"
date-format: 2006-01-02
buildDrafts: false
buildFuture: false
buildExpired: false
enableRobotsTXT: true

deployment:
  targets:
    - name: "torbjorn.no"
      URL: "s3://torbjorn.no?endpoint=https://s3.nl-ams.scw.cloud&region=nl-ams"

permalinks:
  note: "/note/:year/:month/:day/:slug/"
  post: "/post/:year/:month/:day/:slug/"
  projects: "/projects/:slug/"

params:
  description: "Torbjørn Bakken Pedersen's personal web page"
  footer: "&copy; Torbjørn Bakken Pedersen 2023 -- {Year}"
  goatcounter: "torbjorn888888"
  favicon: "/favicon.png"
  defaultImage: "/cover.png"
  contact:
    - label: email
      url: mailto:tbp@tuta.io
    - label: mastodon
      url: https://digipres.club/@tbp
    - label: linkedin
      url: https://www.linkedin.com/in/torbjørn-pedersen-57617b227
    - label: instagram
      url: https://www.instagram.com/filmarkivar
    - label: github
      url: https://github.com/torbjornbp

imaging:
  jpeg:
    quality: 85
  webp:
    quality: 85
  avif:
    quality: 85

minify:
  disableCSS: false
  disableHTML: false
  disableJS: false
  disableJSON: false
  disableSVG: false
  disableXML: false
  minifyOutput: true

markup:
  highlight:
    style: bw
    guessSyntax: true
  markup:
    tableOfContents:
      endLevel: 3
      ordered: false
      startLevel: 2
  goldmark:
    renderer:
      unsafe: true
    extensions:
      extras:
        delete:
          enable: true
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
      strikethrough: false
      passthrough:
        enable: true
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \\(
            - \\)
          - - $
            - $
